name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Typecheck
        run: bunx tsc -b
      - name: Export legacy figures
        run: bun run export
      - name: Export Spec figures
        run: bun run export:spec
      - name: Verify SVG exports
        run: bun run verify
      - name: Verify coverage generation
        run: bun run coverage
